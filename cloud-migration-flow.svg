  <path class="arrow" d="M890 109 H940" marker-end="url(#arrow)"/>
  <text class="title" x="995" y="94" text-anchor="middle">ECS / RDS</text>
  <text class="title" x="995" y="120" text-anchor="middle">S3 / ELB</text>

  <circle class="dot" r="6">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M0 0 L245 0 L245 -45 L360 -45 L360 0 L430 0 L430 45 L500 45 L500 0 L570 0 L570 45 L640 45 L640 0 L710 0 L710 0 L760 0"/>
