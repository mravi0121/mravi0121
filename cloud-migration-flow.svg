      .dot{fill:#0969da}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect width="1100" height="220" rx="18" fill="white"/>
  <rect class="box" x="40" y="80" width="170" height="58" rx="12"/>
  <text class="title" x="125" y="115" text-anchor="middle">On-Premises</text>

  <path class="arrow" d="M215 109 H285" marker-end="url(#arrow)"/>
  <rect class="box" x="295" y="35" width="130" height="58" rx="12"/>
  <text class="title" x="360" y="70" text-anchor="middle">AWS MGN</text>

  <rect class="box" x="295" y="105" width="130" height="58" rx="12"/>
  <text class="title" x="360" y="140" text-anchor="middle">AWS DMS</text>

  <rect class="box" x="295" y="175" width="130" height="0" rx="12"/>

  <path class="arrow" d="M430 64 H500" marker-end="url(#arrow)"/>
  <path class="arrow" d="M430 134 H500" marker-end="url(#arrow)"/>

  <rect class="box" x="510" y="80" width="150" height="58" rx="12"/>
