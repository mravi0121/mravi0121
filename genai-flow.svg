<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="180" viewBox="0 0 1050 180">
  <defs>
    <style>
      .box{fill:#f6f8fa;stroke:#24292f;stroke-width:2}
      .title{font:600 15px Arial,sans-serif;fill:#24292f}
      .arrow{stroke:#0969da;stroke-width:3;fill:none;stroke-linecap:round}
      .dot{fill:#0969da}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect width="1050" height="180" rx="18" fill="white"/>
  <g transform="translate(25,61)">
    <rect class="box" width="105" height="58" rx="12"/><text class="title" x="52" y="35" text-anchor="middle">User</text>
    <path class="arrow" d="M110 29 H145" marker-end="url(#arrow)"/>
    <rect class="box" x="155" width="135" height="58" rx="12"/><text class="title" x="222" y="35" text-anchor="middle">API Gateway</text>
    <path class="arrow" d="M295 29 H330" marker-end="url(#arrow)"/>
    <rect class="box" x="340" width="115" height="58" rx="12"/><text class="title" x="397" y="35" text-anchor="middle">Lambda</text>
    <path class="arrow" d="M460 29 H495" marker-end="url(#arrow)"/>
    <rect class="box" x="505" width="145" height="58" rx="12"/><text class="title" x="577" y="35" text-anchor="middle">Amazon Bedrock</text>
    <path class="arrow" d="M655 29 H690" marker-end="url(#arrow)"/>
    <rect class="box" x="700" width="155" height="58" rx="12"/><text class="title" x="777" y="35" text-anchor="middle">Agentic Workflow</text>
    <path class="arrow" d="M860 29 H895" marker-end="url(#arrow)"/>
    <rect class="box" x="905" width="110" height="58" rx="12"/><text class="title" x="960" y="35" text-anchor="middle">Response</text>
    <circle class="dot" r="6">
      <animateMotion dur="4s" repeatCount="indefinite" path="M0 29 H145 M155 29 H330 M340 29 H495 M505 29 H690 M700 29 H895 M905 29 H990"/>
    </circle>
  </g>
</svg>