 <rect x="245" y="124" width="150" height="58" rx="14" fill="#fff" stroke="#24292f" stroke-width="2"/><text x="320" y="158" font-size="14">AWS DMS</text>
 <rect x="245" y="200" width="150" height="58" rx="14" fill="#fff" stroke="#24292f" stroke-width="2"/><text x="320" y="234" font-size="14">DataSync</text>

