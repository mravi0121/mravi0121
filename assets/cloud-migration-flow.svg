<g stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#a)">
 <path d="M190 153H235"/><path d="M395 77L445 130"/><path d="M395 153H445"/><path d="M395 229L445 176"/>
 <path d="M610 153H660"/>
 <path d="M825 130L875 77"/><path d="M825 153H875"/><path d="M825 176L875 229"/>
</g>

<!-- three source streams converge, then split into AWS targets -->
<g fill="#2563eb" filter="url(#glow)">
 <circle r="6"><animateMotion dur="1.0s" begin="0s" repeatCount="indefinite" path="M190 153H235"/></circle>
 <circle r="6"><animateMotion dur="0.9s" begin="1.0s" repeatCount="indefinite" path="M395 77L445 130"/></circle>
 <circle r="6"><animateMotion dur="0.9s" begin="1.9s" repeatCount="indefinite" path="M395 153H445"/></circle>
 <circle r="6"><animateMotion dur="0.9s" begin="2.8s" repeatCount="indefinite" path="M395 229L445 176"/></circle>
 <circle r="6"><animateMotion dur="1.0s" begin="3.7s" repeatCount="indefinite" path="M610 153H660"/></circle>
 <circle r="6"><animateMotion dur="0.9s" begin="4.7s" repeatCount="indefinite" path="M825 130L875 77"/></circle>
 <circle r="6"><animateMotion dur="0.9s" begin="5.6s" repeatCount="indefinite" path="M825 153H875"/></circle>
 <circle r="6"><animateMotion dur="0.9s" begin="6.5s" repeatCount="indefinite" path="M825 176L875 229"/></circle>
</g>

<text x="600" y="291" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Discover → Migrate → Provision → Secure → Validate → Cutover</text>
