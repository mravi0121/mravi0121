 <rect x="885" y="124" width="125" height="58" rx="14" fill="#fff" stroke="#24292f" stroke-width="2"/><text x="947" y="158" font-size="13">RDS</text>
 <rect x="885" y="200" width="125" height="58" rx="14" fill="#fff" stroke="#24292f" stroke-width="2"/><text x="947" y="234" font-size="13">S3</text>
