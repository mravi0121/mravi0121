<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/>
    </filter>
    <style>
      .bubble { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 14px; }
      .small { font-family: Arial, Helvetica, sans-serif; font-weight: 600; font-size: 12px; }
      .line { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 5 6; opacity: .65; }
      .float1 { animation: float1 5s ease-in-out infinite; }
      .float2 { animation: float2 6s ease-in-out infinite; }
      .float3 { animation: float3 5.5s ease-in-out infinite; }
      .float4 { animation: float4 7s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 450px 130px; }
      @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(0,-9px)} }
      @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(7px,6px)} }
      @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-7px,-6px)} }
      @keyframes float4 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5px,-8px)} }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
    </style>
  </defs>

  <rect x="8" y="8" width="884" height="244" rx="24" fill="url(#bg)" stroke="#dbe5f1"/>

  <!-- Connection network -->
  <path class="line" d="M450 130 L125 55 M450 130 L285 45 M450 130 L615 45 M450 130 L775 58"/>
  <path class="line" d="M450 130 L105 190 M450 130 L275 215 M450 130 L625 215 M450 130 L790 190"/>

  <!-- Core -->
  <g class="pulse" filter="url(#shadow)">
    <circle cx="450" cy="130" r="62" fill="url(#core)"/>
    <circle cx="450" cy="130" r="54" fill="none" stroke="#fff" stroke-opacity=".28"/>
    <text x="450" y="124" text-anchor="middle" fill="#fff" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="800">CLOUD</text>
    <text x="450" y="147" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700">ENGINEERING</text>
  </g>

  <!-- Top bubbles -->
  <g class="float1" filter="url(#shadow)">
    <rect x="63" y="31" width="125" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="125.5" y="60" text-anchor="middle" class="bubble" fill="#1e3a8a">☁ AWS</text>
  </g>

  <g class="float2" filter="url(#shadow)">
    <rect x="220" y="22" width="130" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="285" y="51" text-anchor="middle" class="bubble" fill="#334155">⚙ DevOps</text>
  </g>

  <g class="float3" filter="url(#shadow)">
    <rect x="550" y="22" width="130" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="615" y="51" text-anchor="middle" class="bubble" fill="#5b21b6">🏗 IaC</text>
  </g>

  <g class="float4" filter="url(#shadow)">
    <rect x="712" y="34" width="125" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="774.5" y="63" text-anchor="middle" class="bubble" fill="#0369a1">🐳 Docker</text>
  </g>

  <!-- Bottom bubbles -->
  <g class="float3" filter="url(#shadow)">
    <rect x="42" y="165" width="130" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="107" y="194" text-anchor="middle" class="bubble" fill="#166534">🔐 Security</text>
  </g>

  <g class="float1" filter="url(#shadow)">
    <rect x="210" y="190" width="130" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="275" y="219" text-anchor="middle" class="bubble" fill="#0f766e">☸ Kubernetes</text>
  </g>

  <g class="float4" filter="url(#shadow)">
    <rect x="560" y="190" width="130" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="625" y="219" text-anchor="middle" class="bubble" fill="#7c2d12">📊 Observability</text>
  </g>

  <g class="float2" filter="url(#shadow)">
    <rect x="730" y="165" width="130" height="48" rx="24" fill="#fff" stroke="#d7e2f0"/>
    <text x="795" y="194" text-anchor="middle" class="bubble" fill="#9a3412">🤖 GenAI</text>
  </g>
</svg>